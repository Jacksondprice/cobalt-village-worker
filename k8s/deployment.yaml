apiVersion: apps/v1
kind: Deployment
metadata:
  name: cobalt-village-worker
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksondprice/cobalt-village-worker:1.4.0
          envFrom:
            - secretRef:
                name: app-secrets
